# Alembic configuration.
#
# The database URL is NOT here: it comes from the application's settings object
# at runtime (see alembic/env.py), so migrations cannot run against a different
# database than the app, and no credential is ever written to a committed file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Timestamped, ordered filenames so a directory listing reads chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
