# IRONMAN Calella-Barcelona -- the Maresme coast, north of Barcelona.
#
# Calella is a seafront town on a long, straight north-east/south-west beach,
# hemmed in by the Serralada Litoral. Pointed inland the loop turns into a
# mountain course, so the bike leg follows the coastal shelf instead and the
# run stays on the promenade.
course_id: calella-barcelona-full
slug: calella-barcelona-full
