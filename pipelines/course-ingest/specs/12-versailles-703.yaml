# IRONMAN 70.3 Versailles -- the Yvelines, west of Paris.
#
# STATUS: pending, and blocked on data rather than on effort. Read the note
# below before changing `status` to `ready`; generating it as it stands fails
# in Stage 3 and writes nothing.
#
# The only inland course in the catalogue, and the only one whose swim cannot
# be sited. A 70.3 swim is a 1.9 km rectangle at 3:1 -- roughly 710 m by 240 m
# -- and every node of it must sit 15 m inside a real water polygon. Nothing
# within reach of Versailles satisfies that in the pinned Overture water
# theme:
#
#   Grand Canal (the chateau, and the real race's venue)  no water polygon
#   Etang de Saint-Quentin, all approaches                no water polygon
#   Etang de Saclay, Trappes, Rambouillet                 no water polygon
#   Lac de Creteil, Bois de Boulogne, Vaires-sur-Marne    no water polygon
#   the Seine at Verneuil, Moisson                        no water polygon
#
# The nearest water that does hold the course is the Etang de la Folie at
# Cergy-Pontoise, 30 km north and in another department. Building the course
# there and calling it Versailles would put a customer's course map, terrain,
# weather and start line 30 km from the race they paid for, so the catalogue
# lists this event as COMING_SOON instead -- announced, dated, and honestly
# not enterable.
#
# What closes it, in order of preference:
#   1. A licensed course file for the real Grand Canal swim, fed to stages
#      4-10 directly. This is the right answer: it is a real race with a real
#      published course.
#   2. A water source with French inland hydrography (IGN BD TOPAGE, or OSM
#      water relations) behind `RoadSource.water_rings_in_bbox`. The Grand
#      Canal is about 60 m wide, so it would also need a per-course
#      `rectangle_aspect` override -- at 12:1 the course is 877 m by 73 m,
#      which fits. `rectangle_aspect` is global config today and changing it
#      would alter every existing bundle.
course_id: versailles-703
